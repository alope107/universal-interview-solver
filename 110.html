<!doctype html><html lang="en"><meta charset="utf-8"><title>Rule 110 in CSS</title>
<style>
/* Rule 110, self-clocked, no script, no interaction.
   Memory: each cell is two leaves (A, B) whose state is the browser's last remembered size.
   Clock:  one infinite animation on the grid flips --phase; style queries route it.
   Wires:  column j carries A_j as a track width, row j carries B_j as a track height.
   Read:   a carrier spanning tracks j-1..j+1 sees the neighborhood as one weighted sum
           (weights 10/20/40px by track index mod 3), decoded by @container ranges.
   Rule:   the @container blocks below are the Rule 110 lookup table.
   Change the cycle in .g's animation, the width in the generator (N = 48). */

body { margin: 0; font: 14px system-ui, sans-serif; }
.strip { position: fixed; top: 0; left: 0; right: 0; height: 20px; background: #fff; border-bottom: 1px solid #ccc; z-index: 1; }
.label { position: absolute; top: 26px; left: 4px; white-space: nowrap; color: #555; font-size: 12px; }
.g {
  --phase: 0; container-name: clk; animation: tick 500ms infinite;
  display: grid; position: relative; margin-top: 52px;
  grid-template-columns: repeat(50, auto); grid-template-rows: repeat(50, auto);
  justify-content: start; align-content: start;
}
@keyframes tick { 0%, 49.9% { --phase: 0; } 50%, 100% { --phase: 1; } }
.c { container-type: inline-size; }                              /* row j, cols j-1..j+1: reads A neighborhood, carries B_j */
.d { container-type: inline-size; writing-mode: vertical-lr; }   /* col j, rows j-1..j+1: reads B neighborhood, carries A_j */
.e { container-type: inline-size; }                              /* col j only: display of A_j */
.f { container-type: inline-size; writing-mode: vertical-lr; }   /* row j only: display of B_j */
.a, .b { content-visibility: hidden; contain-intrinsic-size: auto 0px; width: auto; height: auto; }
.a { background: rgba(30,90,255,.18); }
.b { background: rgba(255,60,30,.18); }
.lamp { position: fixed; top: 4px; width: 12px; height: 12px; background: #eee; writing-mode: horizontal-tb; }
@container (inline-size > 5px) { .lamp { background: #111; } }
@container clk style(--phase: 0) { .lb { display: none; } .b { content-visibility: visible; height: 0px; } }
@container clk style(--phase: 1) { .la { display: none; } .a { content-visibility: visible; width: 0px; } }
